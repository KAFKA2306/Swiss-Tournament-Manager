name: Clean install and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swiss-tournament-manager/client
    steps:
      - uses: actions/checkout@v7
      - name: Reject tracked dependencies
        run: |
          if git ls-files | grep -E '(^|/)node_modules/'; then
            echo 'Tracked node_modules are forbidden.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: swiss-tournament-manager/client/package-lock.json
      - run: npm ci
      - run: npm run test:ci
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Ensure install/build did not modify tracked files
        run: git diff --exit-code

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swiss-tournament-manager/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: swiss-tournament-manager/server/package-lock.json
      - run: npm ci
      - run: npm run smoke
      - name: Ensure install did not modify tracked files
        run: git diff --exit-code
